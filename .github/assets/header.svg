<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://w3.org">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <style>
      .tile { fill: #21262D; stroke: #30363D; stroke-width: 2; rx: 8; }
      .tile-accent { fill: #1F6FEB; stroke: #388BFD; stroke-width: 2; rx: 8; }
      .letter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #F0F6FC; text-anchor: middle; dominant-baseline: central; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #8B949E; text-anchor: middle; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>

  <!-- Fichas: A N A G R A M A -->
  <g transform="translate(150, 55)">
    <rect x="0"   y="0" width="52" height="52" class="tile-accent"/>
    <text x="26"  y="27" class="letter">A</text>

    <rect x="64"  y="0" width="52" height="52" class="tile"/>
    <text x="90"  y="27" class="letter">N</text>

    <rect x="128" y="0" width="52" height="52" class="tile"/>
    <text x="154" y="27" class="letter">A</text>

    <rect x="192" y="0" width="52" height="52" class="tile-accent"/>
    <text x="218" y="27" class="letter">G</text>

    <rect x="256" y="0" width="52" height="52" class="tile"/>
    <text x="282" y="27" class="letter">R</text>

    <rect x="320" y="0" width="52" height="52" class="tile"/>
    <text x="346" y="27" class="letter">A</text>

    <rect x="384" y="0" width="52" height="52" class="tile"/>
    <text x="410" y="27" class="letter">M</text>

    <rect x="448" y="0" width="52" height="52" class="tile-accent"/>
    <text x="474" y="27" class="letter">A</text>
  </g>

  <!-- Subtítulo -->
  <text x="400" y="148" class="subtitle">GENERADOR Y BUSCADOR DE ANAGRAMAS</text>
</svg>