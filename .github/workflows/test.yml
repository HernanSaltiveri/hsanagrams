name: Testing

on:
    workflow_dispatch:
#    push:
#        branches: [main]
#    pull_request:
#        branches: [main]

permissions:
  contents: read       # Required for actions/checkout
  checks: write        # Required to create the test report check run
  pull-requests: write # Required to post/update summary comments on PRs
  issues: read         # Required in private repos for some actions (e.g., EnricoMi)

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/checkout@v7

            - name: install python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'
            #    cache: 'pip'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install -e .
                curl -LsSf https://astral.sh/uv/install.sh | sh
                uv sync
                pwd


            - name: List all files in the container
              run: tree

            - name: Run build
              run: python scripts/build.py

            - name: Install anagrams
              run: pip install dist/*.whl
              

            - name: Run tests
              #working-directory: ./anagrams
              run: python scripts/run_tests.py
            
            - name: Publish Test Results
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: (!cancelled())
              with:
                files: |
                    test-results/**/*.xml
                    
            - name: Clear workspace
              if: always() # Ensures cleanup runs even if previous steps fail
              run: |
                rm -rf "${{ github.workspace }}"/*
                rm -rf "${{ github.workspace }}"/.[!.]*