name: Bump TOML Version

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Prevent infinite loops when the workflow commits back to main
    if: "!contains(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Increment Patch Version
        id: bump
        run: |
          python3 -c '
          import re
          with open("pyproject.toml", "r") as f:
              content = f.read()

          def repl(match):
              major, minor, patch = map(int, match.groups())
              new_ver = f"{major}.{minor}.{patch + 1}"
              with open("new_version.txt", "w") as vf:
                  vf.write(new_ver)
              return f"version = \"{new_ver}\""

          updated = re.sub(r"^version\s*=\s*\"(\d+)\.(\d+)\.(\d+)\"", repl, content, count=1, flags=re.MULTILINE)
          with open("pyproject.toml", "w") as f:
              f.write(updated)
          '
          echo "NEW_VERSION=$(cat new_version.txt)" >> $GITHUB_ENV
          rm new_version.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): bump version to ${{ env.NEW_VERSION }}"
          git push
